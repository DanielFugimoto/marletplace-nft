# Kurio — server block para VPS (Nginx). Sirva o conteúdo de `dist/` (npm run build).
# O MSW roda num Service Worker, que o navegador só registra em HTTPS (ou localhost):
# publique atrás de TLS (ex.: certbot --nginx) ou a aplicação não inicializa.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome: cache imutável.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imagens dos NFTs (sem hash no nome).
    location /nfts/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # O worker do MSW precisa ser revalidado a cada carga.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fallback SPA: qualquer rota (/nft/..., /perfil, ...) recebe o index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
